<style>
  :root{
    --navy-950:#03080f; --navy-900:#050d18; --navy-850:#081426; --navy-800:#0a192f;
    --cyan-500:#00a3e0; --cyan-400:#22b8f0; --cyan-300:#6fd3f7;
    --line:rgba(255,255,255,.12); --fs:16px;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;font-family:Vazirmatn,"Segoe UI",Tahoma,sans-serif;color:#fff;
    background:var(--navy-900);
  }
  .bg{
    position:fixed;inset:0;z-index:0;
    background-image:
      linear-gradient(180deg,rgba(3,8,15,.82),rgba(3,8,15,.94)),
      url("/img/hero.jpg");
    background-size:cover;background-position:center;
  }
  .bg::after{
    content:"";position:absolute;inset:0;
    background:radial-gradient(70% 60% at 50% 45%,rgba(0,163,224,.18),transparent 70%);
  }
  .wrap{
    position:relative;z-index:1;min-height:100%;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:2.2rem;padding:2rem 1.25rem;text-align:center;
  }
  .logo{
    width:min(260px,62vw);height:auto;display:block;
    filter:drop-shadow(0 8px 28px rgba(0,0,0,.75));
  }
  .tag{
    margin:0;font-size:.95rem;line-height:1.9;color:rgba(255,255,255,.62);
    max-width:44ch;
  }
  .langs{
    display:grid;gap:.7rem;width:min(420px,100%);
    grid-template-columns:1fr;
  }
  .lang{
    display:flex;align-items:center;justify-content:space-between;gap:1rem;
    padding:1rem 1.25rem;border:1px solid var(--line);border-radius:14px;
    background:rgba(10,25,47,.55);backdrop-filter:blur(6px);
    color:#fff;text-decoration:none;font-weight:700;font-size:1rem;
    transition:transform .18s ease,border-color .18s ease,background .18s ease;
  }
  .lang:hover,.lang:focus-visible{
    border-color:var(--cyan-500);background:rgba(0,163,224,.14);
    transform:translateY(-2px);outline:none;
  }
  .lang small{display:block;font-weight:400;font-size:.76rem;color:rgba(255,255,255,.5);margin-top:.15rem}
  .lang .ar{font-weight:400;font-size:.8rem;color:var(--cyan-300);white-space:nowrap}
  .foot{
    margin:0;font-size:.74rem;color:rgba(255,255,255,.4);letter-spacing:.02em;
  }
  .foot a{color:rgba(255,255,255,.55)}
  @media (min-width:720px){
    .langs{grid-template-columns:repeat(3,1fr)}
    .lang{flex-direction:column;gap:.35rem;padding:1.6rem 1rem}
  }
  @media (prefers-reduced-motion:reduce){
    .lang{transition:none}
    .lang:hover,.lang:focus-visible{transform:none}
  }
</style>
